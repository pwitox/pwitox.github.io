<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Multi Timer</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    h1 {
      margin: 20px;
    }

    .controls {
      margin-bottom: 20px;
    }

    .reset-all {
      padding: 10px 20px;
      border-radius: 10px;
      border: none;
      background: #e74c3c;
      color: white;
      cursor: pointer;
    }

    .container {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    /* NEU: Reihe mit Icon + Timer */
    .row {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .lane-icon {
      width: 50px;
      height: 50px;
    }

    .timer {
      background: #222;
      padding: 15px;
      border-radius: 15px;
      width: 260px;
    }

    .time {
      font-size: 26px;
      margin-bottom: 10px;
    }

    .icon {
      width: 60px;
      height: 60px;
      cursor: pointer;
      transition: transform 0.1s, opacity 0.2s;
    }

    .icon:hover {
      transform: scale(1.1);
    }

    .disabled {
      opacity: 0.4;
      pointer-events: none;
    }

    .buttons {
      margin-top: 10px;
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      justify-content: center;
    }

    .time-btn {
      padding: 5px 8px;
      font-size: 12px;
      border-radius: 8px;
      border: none;
      background: #444;
      color: white;
      cursor: pointer;
    }

    .active {
      background: #4CAF50;
    }

    .finished {
      background: #e74c3c !important;
    }
  </style>
</head>
<body>

<h1>⚡ Multi Timer</h1>

<div class="controls">
  <button class="reset-all" onclick="resetAll()">🔄 Alle zurücksetzen</button>
</div>

<div class="container" id="timers"></div>

<script>
const presets = [
  {time: 300, label: "300s (nix)"},
  {time: 272, label: "272s (boots)"},
  {time: 254, label: "254s (rune)"},
  {time: 234, label: "234s (boots+rune)"}
];

// Lane Icons (oben → unten)
const laneIcons = [
  "Top_icon.png",
  "Jungle_icon.png",
  "Middle_icon.png",
  "Bottom_icon.png",
  "Support_icon.png"
];

const flashIconURL = "Flash_HD.png";

const timersContainer = document.getElementById("timers");
const timers = [];

class Timer {
  constructor(id) {
    this.id = id;
    this.time = presets[0].time;
    this.remaining = this.time;
    this.interval = null;

    this.createUI();
    timers.push(this);
  }

  createUI() {
    // NEU: ganze Reihe
    this.row = document.createElement("div");
    this.row.className = "row";

    // Lane Icon
    this.laneIcon = document.createElement("img");
    this.laneIcon.src = laneIcons[this.id];
    this.laneIcon.className = "lane-icon";

    // Timer Box
    this.el = document.createElement("div");
    this.el.className = "timer";

    this.timeDisplay = document.createElement("div");
    this.timeDisplay.className = "time";

    this.icon = document.createElement("img");
    this.icon.src = flashIconURL;
    this.icon.className = "icon";
    this.icon.onclick = () => this.start();

    this.buttonsDiv = document.createElement("div");
    this.buttonsDiv.className = "buttons";

    this.buttons = [];

    presets.forEach((p, index) => {
      const btn = document.createElement("button");
      btn.className = "time-btn";
      btn.innerText = p.label;

      btn.onclick = () => {
        this.reset(p.time);
        this.setActiveButton(index);
      };

      this.buttons.push(btn);
      this.buttonsDiv.appendChild(btn);
    });

    this.setActiveButton(0);

    this.el.appendChild(this.timeDisplay);
    this.el.appendChild(this.icon);
    this.el.appendChild(this.buttonsDiv);

    // Zusammenbauen
    this.row.appendChild(this.laneIcon);
    this.row.appendChild(this.el);

    timersContainer.appendChild(this.row);

    this.updateDisplay();
  }

  setActiveButton(index) {
    this.buttons.forEach(b => b.classList.remove("active"));
    this.buttons[index].classList.add("active");
  }

  updateDisplay() {
    const min = Math.floor(this.remaining / 60);
    const sec = this.remaining % 60;
    this.timeDisplay.innerText =
      `${min}:${sec.toString().padStart(2, '0')}`;
  }

  start() {
    if (this.interval) return;

    this.icon.classList.add("disabled");

    this.interval = setInterval(() => {
      this.remaining--;
      this.updateDisplay();

      if (this.remaining <= 0) {
        clearInterval(this.interval);
        this.interval = null;
        this.el.classList.add("finished");
      }
    }, 1000);
  }

  reset(newTime = this.time) {
    clearInterval(this.interval);
    this.interval = null;
    this.time = newTime;
    this.remaining = newTime;

    this.el.classList.remove("finished");
    this.icon.classList.remove("disabled");

    this.updateDisplay();
  }
}

// 5 Timer
for (let i = 0; i < 5; i++) {
  new Timer(i);
}

function resetAll() {
  timers.forEach(timer => timer.reset(timer.time));
}
</script>

</body>
</html>
