<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Oily's loser support tool</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

/* TITLE */
h1 {
  margin-top: 15px;
}

/* CONTAINER */
.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

/* ROW (Lane + Timer + Endtime) */
.row {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 10px;
  width: 100%;
}

/* LANE ICON */
.lane-icon {
  width: 55px;
  height: 55px;
}

/* TIMER BOX (GILT JETZT AUCH FÜR GAME TIMER) */
.timer {
  background: #222;
  padding: 15px;
  border-radius: 15px;
  width: 260px;
  position: relative;
}

/* TIME TEXT */
.time {
  font-size: 24px;
  margin-bottom: 10px;
}

/* FLASH ICON */
.icon {
  width: 60px;
  cursor: pointer;
}

/* BUTTONS */
.time-btn {
  margin: 2px;
  padding: 5px;
  border-radius: 6px;
  border: none;
  background: #444;
  color: white;
  cursor: pointer;
}

.active {
  background: #4CAF50;
}

.finished {
  background: #e74c3c;
}

/* 🔥 END TIME */
.end-time {
  font-size: 28px;
  font-weight: bold;
  margin-left: 30px;
  min-width: 120px;
  text-align: left;
  color: #ffd700;
}

/* GAME TIMER (jetzt nur noch minimale Anpassung) */
.game-timer {
  width: 260px;
}
</style>
</head>

<body>

<h1>Oily's loser support tool</h1>

<!-- GAME TIMER (JETZT IM TIMER-DESIGN) -->
<div class="container">
  <div class="row">
    <div class="timer game-timer">
      <div class="time" id="gameTime">00:00</div>
      <div>
        <button onclick="startGame()" class="time-btn">Start</button>
        <button onclick="resetGame()" class="time-btn">Reset</button>
      </div>
    </div>
  </div>
</div>

<!-- CHAMP TIMERS -->
<div class="container" id="timers"></div>

<script>
const presets = [
  {time:300,label:"300s (nix)"},
  {time:272,label:"272s (boots)"},
  {time:254,label:"254s (rune)"},
  {time:234,label:"234s (boots+rune)"}
];

const laneIcons = [
  "Top_icon.png",
  "Jungle_icon.png",
  "Middle_icon.png",
  "Bottom_icon.png",
  "Support_icon.png"
];

const flashIconURL = "flash.png";

/* GAME TIMER */
let gameSeconds = 0;
let gameInterval = null;

function startGame(){
  if(gameInterval) return;
  gameInterval = setInterval(()=>{
    gameSeconds++;
    const m=Math.floor(gameSeconds/60);
    const s=gameSeconds%60;
    document.getElementById("gameTime").innerText =
      `${m}:${s.toString().padStart(2,"0")}`;
  },1000);
}

function resetGame(){
  clearInterval(gameInterval);
  gameInterval=null;
  gameSeconds=0;
  document.getElementById("gameTime").innerText="00:00";
}

/* TIMERS */
const timers=[];

class Timer{
  constructor(id){
    this.id=id;
    this.time=presets[0].time;
    this.remaining=this.time;
    this.interval=null;

    this.create();
    timers.push(this);
  }

  create(){
    this.row=document.createElement("div");
    this.row.className="row";

    this.iconLane=document.createElement("img");
    this.iconLane.src=laneIcons[this.id];
    this.iconLane.className="lane-icon";

    this.el=document.createElement("div");
    this.el.className="timer";

    this.timeDisplay=document.createElement("div");
    this.timeDisplay.className="time";

    this.flash=document.createElement("img");
    this.flash.src=flashIconURL;
    this.flash.className="icon";
    this.flash.onclick=()=>this.start();

    this.buttonsDiv=document.createElement("div");

    this.endTime=document.createElement("div");
    this.endTime.className="end-time";

    this.buttons=[];

    presets.forEach((p,i)=>{
      const b=document.createElement("button");
      b.className="time-btn";
      b.innerText=p.label;

      b.onclick=()=>{
        this.reset(p.time);
        this.setActive(i);
      };

      this.buttons.push(b);
      this.buttonsDiv.appendChild(b);
    });

    this.setActive(0);

    this.el.appendChild(this.timeDisplay);
    this.el.appendChild(this.flash);
    this.el.appendChild(this.buttonsDiv);

    this.row.appendChild(this.iconLane);
    this.row.appendChild(this.el);
    this.row.appendChild(this.endTime);

    document.getElementById("timers").appendChild(this.row);

    this.update();
  }

  setActive(i){
    this.buttons.forEach(b=>b.classList.remove("active"));
    this.buttons[i].classList.add("active");
  }

  update(){
    const m=Math.floor(this.remaining/60);
    const s=this.remaining%60;
    this.timeDisplay.innerText=`${m}:${s.toString().padStart(2,"0")}`;
  }

  start(){
    if(this.interval) return;

    const end = gameSeconds + this.time;
    const m=Math.floor(end/60);
    const s=end%60;

    this.endTime.innerText =
      `${m}:${s.toString().padStart(2,"0")}`;

    this.interval=setInterval(()=>{
      this.remaining--;
      this.update();

      if(this.remaining<=0){
        clearInterval(this.interval);
        this.el.classList.add("finished");
      }
    },1000);
  }

  reset(t=this.time){
    clearInterval(this.interval);
    this.interval=null;

    this.time=t;
    this.remaining=t;

    this.endTime.innerText="";
    this.el.classList.remove("finished");

    this.update();
  }
}

/* INIT */
for(let i=0;i<5;i++){
  new Timer(i);
}
</script>

</body>
</html>
