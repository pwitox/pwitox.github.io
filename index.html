<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>LoL Timer Tool</title>

<style>
body {
  font-family: Arial;
  background: #111;
  color: white;
  text-align: center;
}

.container {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 15px;
}

/* GAME TIMER */
.game-timer {
  background: #333;
  padding: 15px;
  border-radius: 15px;
  width: 300px;
}

.row {
  display: flex;
  align-items: center;
  gap: 10px;
}

.lane-icon {
  width: 50px;
}

.timer {
  background: #222;
  padding: 15px;
  border-radius: 15px;
  width: 260px;
  position: relative;
}

.time {
  font-size: 24px;
}

.end-time {
  position: absolute;
  right: 10px;
  top: 10px;
  font-size: 14px;
  color: #aaa;
}

.icon {
  width: 60px;
  cursor: pointer;
}

.buttons {
  margin-top: 8px;
}

.time-btn {
  margin: 2px;
  padding: 5px;
  border-radius: 6px;
  border: none;
  background: #444;
  color: white;
}

.active {
  background: #4CAF50;
}

.finished {
  background: #e74c3c;
}
</style>
</head>

<body>

<h1>⚡ LoL Timer Tool</h1>

<!-- GAME TIMER -->
<div class="game-timer">
  <div id="gameTime">00:00</div>
  <button onclick="startGame()">Start</button>
  <button onclick="resetGame()">Reset</button>
</div>

<br>

<button onclick="resetAll()">🔄 Alle Timer reset</button>

<div class="container" id="timers"></div>

<script>
const presets = [
  {time:300,label:"300s (nix)"},
  {time:272,label:"272s (boots)"},
  {time:254,label:"254s (rune)"},
  {time:234,label:"234s (boots+rune)"}
];

const laneIcons = [
  "Top_icon.png",
  "Jungle_icon.png",
  "Middle_icon.png",
  "Bottom_icon.png",
  "Support_icon.png"
];

const flashIconURL = "Flash_HD.png";

let gameSeconds = 0;
let gameInterval = null;

// GAME TIMER
function startGame(){
  if(gameInterval) return;
  gameInterval = setInterval(()=>{
    gameSeconds++;
    updateGameDisplay();
  },1000);
}

function resetGame(){
  clearInterval(gameInterval);
  gameInterval = null;
  gameSeconds = 0;
  updateGameDisplay();
}

function updateGameDisplay(){
  const min = Math.floor(gameSeconds/60);
  const sec = gameSeconds%60;
  document.getElementById("gameTime").innerText =
    `${min}:${sec.toString().padStart(2,"0")}`;
}

// TIMER CLASS
const timers = [];

class Timer{
  constructor(id){
    this.id=id;
    this.time=presets[0].time;
    this.remaining=this.time;
    this.interval=null;

    this.createUI();
    timers.push(this);
  }

  createUI(){
    this.row=document.createElement("div");
    this.row.className="row";

    this.lane=document.createElement("img");
    this.lane.src=laneIcons[this.id];
    this.lane.className="lane-icon";

    this.el=document.createElement("div");
    this.el.className="timer";

    this.timeDisplay=document.createElement("div");
    this.timeDisplay.className="time";

    // END TIME DISPLAY
    this.endTimeDisplay=document.createElement("div");
    this.endTimeDisplay.className="end-time";

    this.icon=document.createElement("img");
    this.icon.src=flashIconURL;
    this.icon.className="icon";
    this.icon.onclick=()=>this.start();

    this.buttonsDiv=document.createElement("div");

    this.buttons=[];

    presets.forEach((p,i)=>{
      const btn=document.createElement("button");
      btn.className="time-btn";
      btn.innerText=p.label;

      btn.onclick=()=>{
        this.reset(p.time);
        this.setActive(i);
      };

      this.buttons.push(btn);
      this.buttonsDiv.appendChild(btn);
    });

    this.setActive(0);

    this.el.appendChild(this.timeDisplay);
    this.el.appendChild(this.endTimeDisplay);
    this.el.appendChild(this.icon);
    this.el.appendChild(this.buttonsDiv);

    this.row.appendChild(this.lane);
    this.row.appendChild(this.el);

    document.getElementById("timers").appendChild(this.row);

    this.update();
  }

  setActive(i){
    this.buttons.forEach(b=>b.classList.remove("active"));
    this.buttons[i].classList.add("active");
  }

  update(){
    const m=Math.floor(this.remaining/60);
    const s=this.remaining%60;
    this.timeDisplay.innerText=`${m}:${s.toString().padStart(2,"0")}`;
  }

  start(){
    if(this.interval) return;

    // 👉 END TIME BERECHNEN
    const end = gameSeconds + this.time;
    const m = Math.floor(end/60);
    const s = end%60;

    this.endTimeDisplay.innerText =
      `${m}:${s.toString().padStart(2,"0")}`;

    this.interval=setInterval(()=>{
      this.remaining--;
      this.update();

      if(this.remaining<=0){
        clearInterval(this.interval);
        this.interval=null;
        this.el.classList.add("finished");
      }
    },1000);
  }

  reset(newTime=this.time){
    clearInterval(this.interval);
    this.interval=null;

    this.time=newTime;
    this.remaining=newTime;

    this.el.classList.remove("finished");
    this.endTimeDisplay.innerText="";

    this.update();
  }
}

// CREATE 5 TIMER
for(let i=0;i<5;i++){
  new Timer(i);
}

function resetAll(){
  timers.forEach(t=>t.reset(t.time));
}
</script>

</body>
</html>
